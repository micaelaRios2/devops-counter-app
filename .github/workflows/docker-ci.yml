name: 🚀 Docker CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠️ Probar construcción con Docker Compose
        run: |
          docker compose build

      - name: 🧪 Probar inicio de contenedores
        run: |
          docker compose up -d
          sleep 5
          docker compose ps
          docker compose down
